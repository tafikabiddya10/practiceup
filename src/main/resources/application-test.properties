# ===================================================================
# CodeQuest - Test / In-Memory H2 Profile Configuration
# ===================================================================

spring.application.name=codequest-test

# In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:codequest_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf
spring.thymeleaf.cache=false

# Teacher Registration Code
app.teacher-code=TEACH-2026
