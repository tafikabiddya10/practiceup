# ===================================================================
# CodeQuest - Spring Boot Application Configuration
# ===================================================================

spring.application.name=codequest

# Server Port
server.port=8080

# ===================================================================
# Database Configuration (MySQL 8 Default)
# ===================================================================
# Ensure MySQL is running locally and the database 'codequest' exists:
# CREATE DATABASE IF NOT EXISTS codequest;

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/codequest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# ===================================================================
# CodeQuest Custom Application Settings
# ===================================================================
# Secret code required during registration to register with role TEACHER
app.teacher-code=TEACH-2026
